name: verify

on:
  pull_request:
  push:
    branches: [feature/paper-insight-platform]

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Validate every candidate and test
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -v
          python3 scripts/validate_candidate.py examples/minimal-methods/candidate.json
          while IFS= read -r test_file; do
            python3 "$test_file" -v
          done < <(find papers -mindepth 2 -maxdepth 2 -name 'test_*.py' -print | sort)
          while IFS= read -r candidate; do
            python3 scripts/validate_candidate.py "$candidate"
          done < <(find papers -mindepth 2 -maxdepth 2 -name candidate.json -print | sort)
          python3 papers/resting-hrv-methods/reproduce.py --verify
          python3 papers/resting-rr-sample-entropy/reproduce.py --verify
          python3 papers/sleep-measure-reliability/reproduce.py --verify
